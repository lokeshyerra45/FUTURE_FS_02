<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customers | Mini CRM</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="dashboard-container">
<aside class="sidebar"><div class="brand"><div class="brand-mark">M</div><div><h2>Mini CRM</h2><small>Client management</small></div></div>
<nav class="menu">
<a data-page="dashboard.html" href="dashboard.html"><span class="menu-icon">⌂</span>Dashboard</a>
<a data-page="leads.html" href="leads.html"><span class="menu-icon">◈</span>Leads</a>
<a data-page="customers.html" href="customers.html"><span class="menu-icon">◉</span>Customers</a>
<a data-page="followups.html" href="followups.html"><span class="menu-icon">◷</span>Follow-ups</a>
<a data-page="reports.html" data-admin-only href="reports.html"><span class="menu-icon">▦</span>Reports</a>
</nav><div class="sidebar-bottom"><div class="user-mini"><div class="avatar" id="sidebarAvatar">U</div><div><strong id="sidebarUserName">User</strong><span id="sidebarUserRole">ROLE</span></div></div>
<a href="#" class="menu" onclick="logout();return false;"><span style="display:block;padding:10px 12px;color:#aeb6c4">↪ Logout</span></a></div></aside>
<main class="main-content"><header class="topbar"><div><h1>Customers</h1><p class="subtitle">Keep customer records clean and easy to access.</p></div><div class="top-actions"><span class="page-user" id="pageUser"></span></div></header>
<section class="form-card"><h2>Add customer</h2><form id="customerForm"><div class="form-grid">
<div class="field"><label>Name *</label><input id="name" required placeholder="Customer name"></div><div class="field"><label>Email *</label><input id="email" type="email" required placeholder="name@example.com"></div>
<div class="field"><label>Phone *</label><input id="phone" required placeholder="+91 98765 43210"></div><div class="field"><label>Address</label><input id="address" placeholder="City, state"></div></div>
<div class="actions"><button type="reset" class="btn btn-secondary">Clear</button><button id="saveCustomer" class="btn btn-primary">Add customer</button></div></form></section>
<section class="table-section"><div class="section-head"><div><h2>Customer list</h2><span class="muted" id="customerCount">0 customers</span></div><button class="btn btn-secondary btn-sm" id="refreshCustomers">↻ Refresh</button></div>
<div class="toolbar"><div class="search"><input id="search" placeholder="Search customer, email, phone..."></div></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Action</th></tr></thead><tbody id="customerTableBody"></tbody></table></div></section></main></div><div id="toast" class="toast"></div><script src="js/app.js"></script><script src="js/customers.js"></script></body></html>
