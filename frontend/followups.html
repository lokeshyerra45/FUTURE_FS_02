<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow-ups | Mini CRM</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="dashboard-container">
<aside class="sidebar"><div class="brand"><div class="brand-mark">M</div><div><h2>Mini CRM</h2><small>Client management</small></div></div>
<nav class="menu">
<a data-page="dashboard.html" href="dashboard.html"><span class="menu-icon">⌂</span>Dashboard</a>
<a data-page="leads.html" href="leads.html"><span class="menu-icon">◈</span>Leads</a>
<a data-page="customers.html" href="customers.html"><span class="menu-icon">◉</span>Customers</a>
<a data-page="followups.html" href="followups.html"><span class="menu-icon">◷</span>Follow-ups</a>
<a data-page="reports.html" data-admin-only href="reports.html"><span class="menu-icon">▦</span>Reports</a>
</nav><div class="sidebar-bottom"><div class="user-mini"><div class="avatar" id="sidebarAvatar">U</div><div><strong id="sidebarUserName">User</strong><span id="sidebarUserRole">ROLE</span></div></div>
<a href="#" class="menu" onclick="logout();return false;"><span style="display:block;padding:10px 12px;color:#aeb6c4">↪ Logout</span></a></div></aside>
<main class="main-content"><header class="topbar"><div><h1>Follow-ups</h1><p class="subtitle">Schedule the next action and keep prospects moving.</p></div><div class="top-actions"><span class="page-user" id="pageUser"></span></div></header>
<section class="form-card"><h2>Schedule follow-up</h2><form id="followupForm"><div class="form-grid">
<div class="field"><label>Lead ID *</label><input type="number" id="leadId" required placeholder="Enter lead ID"></div><div class="field"><label>Follow-up date *</label><input type="date" id="followupDate" required></div>
<div class="field full"><label>Notes *</label><textarea id="notes" rows="4" required placeholder="What should happen next?"></textarea></div></div>
<div class="actions"><button type="reset" class="btn btn-secondary">Clear</button><button id="saveFollowup" class="btn btn-primary">Schedule</button></div></form></section>
<section class="table-section"><div class="section-head"><div><h2>Follow-up list</h2><span class="muted" id="followupCount">0 follow-ups</span></div><button class="btn btn-secondary btn-sm" id="refreshFollowups">↻ Refresh</button></div>
<div class="toolbar"><div class="search"><input id="search" placeholder="Search lead ID or notes..."></div></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Lead ID</th><th>Date</th><th>Notes</th><th>Action</th></tr></thead><tbody id="followupTableBody"></tbody></table></div></section></main></div><div id="toast" class="toast"></div><script src="js/app.js"></script><script src="js/followups.js"></script></body></html>
