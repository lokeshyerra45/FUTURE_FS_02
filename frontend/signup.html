<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Mini CRM</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="login-container"><section class="login-brand"><div class="brand-copy"><div class="brand"><div class="brand-mark">M</div><div><h2>Mini CRM</h2><small>Client management</small></div></div><h1>Build a healthier sales pipeline.</h1><p>Create an account and start managing prospects, customers and follow-ups in one place.</p></div></section>
<section class="login-side"><div class="login-card"><div class="logo-section"><h1>Create account</h1><p>Set up your Mini CRM workspace.</p></div><form id="signupForm"><div class="input-group"><label>Full name</label><input id="name" required placeholder="Your full name"></div><div class="input-group"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="input-group"><label>Password</label><input id="password" type="password" required minlength="6" placeholder="At least 6 characters"></div><div class="input-group"><label>Role</label><select id="role"><option value="EMPLOYEE">Employee</option><option value="ADMIN">Admin</option></select></div><button class="login-btn" id="signupBtn">Create account</button><div id="errorMessage" class="error"></div></form><div class="auth-link">Already have an account? <a href="login.html">Sign in</a></div></div></section></div><script src="js/app.js"></script><script src="js/signup.js"></script></body></html>
